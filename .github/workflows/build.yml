name: Build Crux kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      - name: Get the declared Prelude toolchain
        run: |
          git init "$RUNNER_TEMP/prelude-clang"
          git -C "$RUNNER_TEMP/prelude-clang" remote add origin https://gitlab.com/jjpprrrr/prelude-clang.git
          git -C "$RUNNER_TEMP/prelude-clang" fetch --depth=1 origin ac8fce34dc0f6918672100d7a6e867a66b8afa8f
          git -C "$RUNNER_TEMP/prelude-clang" checkout --detach FETCH_HEAD
      - name: Build Crux source artifacts
        env:
          KERNEL_CLANG_ROOT: ${{ runner.temp }}/prelude-clang
        run: ./build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          include-hidden-files: true
          name: crux-kernel-${{ github.sha }}
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/qcom/*.dtb
            out/arch/arm64/boot/dts/qcom/crux-sm8150-overlay.dtbo
            out/.config
            out/System.map
            out/vmlinux
